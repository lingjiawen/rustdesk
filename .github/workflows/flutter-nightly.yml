name: Flutter Nightly Build

on:
  # The nightly schedule is off in this fork: the full matrix needs upstream's signing
  # secrets and a 3.24.5 source state. Use custom-windows.yml, or run this by hand.
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
